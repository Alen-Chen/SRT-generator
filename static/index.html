<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Video · Page Transcripts</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2733;--mut:#68783b;--line:#e3e7ec;
--acc:#2563eb;--acc2:#eff4ff;--ok:#15803d;--bad:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans TC","PingFang TC",
"Microsoft JhengHei","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
line-height:1.6}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;
padding:14px 24px;background:#101828;color:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;font-weight:700}
header h1 .hl{color:#7fb0ff}
#uiLang{background:#1d2b40;color:#cdd9ea;border:1px solid #33415c;border-radius:8px;
padding:4px 8px;font:inherit;font-size:12px;cursor:pointer}
main{max-width:1210px;margin:24px auto 60px;padding:0 16px;display:grid;
 grid-template-columns:minmax(0,1fr) 330px;column-gap:24px;align-items:start}
main>section{grid-column:1}
#historyPanel{grid-column:2;grid-row:1/span 8;position:sticky;top:80px}
#historyPanel h3{margin:0 0 10px;font-size:14px}
#history{display:flex;flex-direction:column;gap:10px;
 max-height:calc(100vh - 110px);overflow-y:auto;padding-right:2px}
.hitem{background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:10px 13px;cursor:pointer}
.hitem:hover{border-color:#8aa6c9}
.hdate{font-size:11px;color:#64748b;font-weight:600}
.ht1{font-size:14px;font-weight:700;margin:2px 0 0}
.ht2{font-size:12.5px;color:#475569;margin:1px 0 0}
.hsum{font-size:12.5px;color:#475569;margin:6px 0 0;
 display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hsum .szh,.hsum .sen{display:block}
.hsum .sen{font-style:italic;color:#5b6b80;margin-top:3px}
.hitem.open .hsum{display:block;-webkit-line-clamp:unset;overflow:visible}
.hfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;
 margin-top:6px;font-size:11px;color:#94a3b8}
.htog{background:none;border:none;color:#2563eb;font:inherit;font-size:11.5px;
 cursor:pointer;padding:0;white-space:nowrap}
.hacts{display:flex;gap:10px;align-items:center;flex:none}
.hdel{background:none;border:none;color:#b91c1c;font:inherit;font-size:11.5px;
 cursor:pointer;padding:0;white-space:nowrap}
.hdel:hover{text-decoration:underline}
.hdel:disabled{color:#94a3b8;cursor:default;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
padding:20px 22px;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.hidden{display:none!important}
.drop{border:2px dashed #b9c4d4;border-radius:12px;padding:34px 20px;text-align:center;
cursor:pointer;transition:.15s}
.drop.over{border-color:var(--acc);background:var(--acc2)}
.drop input[type=file]{display:none}
#fileList{margin-top:10px}
.fitem{display:flex;align-items:center;gap:10px;font-size:13px;border:1px solid var(--line);
border-radius:8px;padding:5px 12px;background:#fff;margin-top:6px}
.fitem .fnum{background:var(--acc2);color:var(--acc);font-weight:700;font-size:11px;
padding:2px 8px;border-radius:99px}
.fitem .fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .fsz{color:#667085;font-size:12px}
.fitem .rm{border:0;background:none;color:#b91c1c;font-size:15px;cursor:pointer;padding:0 4px}
.fitem .grip{cursor:grab;color:#98a2b3;font-size:14px;white-space:nowrap}
.fitem .mv{border:0;background:none;color:#475467;font-size:11px;cursor:pointer;padding:0 3px}
.fitem .mv:disabled{color:#cdd5df;cursor:default}
.fitem.dragover{border-color:var(--acc);background:var(--acc2);border-style:dashed}
.fitem.dragging{opacity:.4}
.muted{color:#667085;font-size:13px}
.opts{display:flex;gap:22px;flex-wrap:wrap;margin:16px 0;align-items:center;font-size:14px}
.opts label{display:flex;align-items:center;gap:8px}
select,input[type=range]{font:inherit;padding:6px 8px;border:1px solid var(--line);
border-radius:8px;background:#fff}
button.primary{background:var(--acc);border:0;color:#fff;font-size:15px;font-weight:600;
padding:11px 26px;border-radius:10px;cursor:pointer}
button.primary:disabled{background:#9db8e8;cursor:not-allowed}
.bar{height:10px;background:#e8edf3;border-radius:99px;overflow:hidden;margin:10px 0 4px}
#progFill{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#5b8def);
transition:width .5s}
#progStep{font-weight:600}
.rhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 2px 14px}
.rhead h2{margin:0;font-size:20px}
.actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.actions a,.actions button{font-size:13px;padding:7px 14px;border-radius:8px;
text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.actions a.dl{border-color:var(--acc);color:var(--acc)}
.layout{display:grid;grid-template-columns:minmax(320px,5fr) minmax(380px,7fr);gap:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}
main{grid-template-columns:1fr}
#historyPanel{grid-column:1;grid-row:auto;position:static;order:-1;margin-bottom:20px}
#history{max-height:270px;flex-direction:column}}
.vwrap{position:sticky;top:70px;align-self:start}
video{width:100%;border-radius:12px;background:#000;max-height:340px}
#vmeta{font-size:13px;color:#667085;margin-top:6px}
#pages{display:flex;flex-direction:column;gap:14px}
.page{display:grid;grid-template-columns:180px 1fr;gap:14px;background:var(--card);
border:1px solid var(--line);border-radius:12px;padding:12px}
@media(max-width:560px){.page{grid-template-columns:1fr}}
.page img{width:100%;border-radius:8px;aspect-ratio:16/10;object-fit:cover;background:#0b1220}
.page .noimg{width:100%;border-radius:8px;aspect-ratio:16/10;background:#dfe5ec;
display:flex;align-items:center;justify-content:center;color:#8a94a6;font-size:13px}
.phead .pnum{display:inline-block;background:var(--acc2);color:var(--acc);font-size:12px;
font-weight:700;padding:2px 10px;border-radius:99px}
.phead .ptime{font-size:12px;color:#667085;margin-left:8px}
.phead h3{margin:6px 0 8px;font-size:16px}
.segs p{margin:4px 0;font-size:14.5px}
a.ts{font-family:ui-monospace,monospace;font-size:12px;color:var(--acc);cursor:pointer;
text-decoration:none;border-bottom:1px dashed #b6cdf5;margin-right:6px}
a.ts:hover{color:#1e40af}
.err{color:var(--bad);font-weight:600}
.rerip{display:flex;align-items:center;gap:6px;font-size:13px;
border-left:1px solid var(--line);padding-left:12px}
.rerip input[type=range]{width:110px}
#authCard h2{font-size:18px}
.aflds{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.aflds label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.aflds input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.arow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.arow button:not(.primary){font:inherit;padding:10px 18px;border:1px solid var(--line);
border-radius:10px;background:#fff;cursor:pointer}
#userBox{margin-left:14px;display:flex;align-items:center;gap:8px}
#uNameLbl{font-size:13px;color:#e6edf7;font-weight:600;max-width:160px;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
#userBox button{background:#1d2b40;color:#cdd9ea;border:1px solid #33415c;
border-radius:99px;padding:4px 12px;font-size:12px;cursor:pointer}
#userBox button:hover{background:#2a3c5c}
#userBox .rbadge{font-size:11px;padding:2px 9px;border-radius:99px;background:#25406b;
color:#cfe3ff;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.45);display:flex;
align-items:flex-start;justify-content:center;padding:40px 16px;z-index:20}
.mcard{background:#fff;border-radius:14px;padding:20px 22px;max-width:780px;width:100%;
max-height:80vh;overflow:auto;box-shadow:0 8px 30px rgba(16,24,40,.25)}
#usersTable{width:100%;border-collapse:collapse;font-size:13px}
#usersTable th,#usersTable td{border-bottom:1px solid var(--line);padding:6px 8px;
text-align:left;vertical-align:middle}
#usersTable td button{font-size:12px;padding:4px 10px;border:1px solid var(--acc);
border-radius:8px;background:var(--acc2);color:var(--acc);cursor:pointer}
</style>
</head>
<body>
<header>
  <h1><span data-i18n="brand1"></span> · <span class="hl" data-i18n="brand2"></span></h1>
  <select id="uiLang" title="Interface language">
    <option value="auto">Auto</option>
    <option value="en">English</option>
    <option value="zh-TW">繁體中文</option>
    <option value="zh-CN">简体中文</option>
    <option value="ja">日本語</option>
  </select>
  <div id="userBox" class="hidden">
    <span id="uNameLbl"></span>
    <span class="rbadge" id="uRoleLbl"></span>
    <button id="btnUsers" class="hidden" data-i18n="users"></button>
    <button id="btnLogout" data-i18n="signOut"></button>
  </div>
</header>
<main>
  <section id="authCard" class="card hidden" style="max-width:440px;margin:34px auto">
    <h2 style="margin:0 0 14px" data-i18n="authTitle"></h2>
    <div class="aflds">
      <label><span data-i18n="username"></span>
        <input id="auUser" autocomplete="username" maxlength="40"></label>
      <label><span data-i18n="password"></span>
        <input id="auPass" type="password" autocomplete="current-password"></label>
    </div>
    <div class="arow">
      <button class="primary" id="btnLogin" data-i18n="signIn"></button>
      <button id="btnRegister" data-i18n="signUp"></button>
    </div>
    <p class="err" id="authErr"></p>
    <p class="muted" id="authMsg"></p>
    <p class="muted" id="firstNote" data-i18n="firstNote"></p>
  </section>
  <aside id="historyPanel" class="hidden">
    <h3 data-i18n="historyTitle"></h3>
    <div id="history"></div>
  </aside>
  <section id="uploadCard" class="card hidden">
    <div class="drop" id="drop">
      <p data-i18n-html="drop"></p>
      <p class="muted" id="fileInfo" data-i18n="fileInfo"></p>
      <input type="file" id="file" accept="video/*,.mkv,.ts" multiple>
    </div>
    <div id="fileList" class="hidden"></div>
    <p class="muted hidden" id="orderHint" data-i18n="orderHint"></p>
    <div class="opts">
      <label><span data-i18n="model"></span>
        <select id="model">
          <option value="small" data-i18n="opt_small"></option>
          <option value="base" data-i18n="opt_base"></option>
          <option value="tiny" data-i18n="opt_tiny"></option>
          <option value="medium" data-i18n="opt_medium"></option>
          <option value="large-v3-turbo" data-i18n="opt_turbo"></option>
          <option value="large-v3" data-i18n="opt_large"></option>
        </select></label>
      <label><span data-i18n="speech"></span>
        <select id="lang">
          <option value="auto" data-i18n="opt_auto"></option>
          <option value="zh" data-i18n="opt_zh"></option>
          <option value="en" data-i18n="opt_en"></option>
          <option value="ja" data-i18n="opt_ja"></option>
          <option value="ko" data-i18n="opt_ko"></option>
        </select></label>
      <label><span data-i18n="sens"></span>
        <input type="range" id="scene" min="0.01" max="0.2" step="0.005" value="0.03">
        <span id="sceneVal">0.030</span></label>
      <label><input type="checkbox" id="correct" checked>
        <span data-i18n="correctOpt"></span></label>
    </div>
    <button class="primary" id="submit" disabled data-i18n="start"></button>
    <p class="muted" id="upErr"></p>
  </section>

  <section id="progressCard" class="card hidden" style="margin-top:18px">
    <div id="progStep" data-i18n="preparing"></div>
    <div class="bar"><div id="progFill"></div></div>
    <div class="muted"><span id="progPct">0%</span> <span id="progNote"></span></div>
  </section>

  <section id="result" class="hidden" style="margin-top:18px">
    <div class="rhead">
      <h2 id="vtitle"></h2>
      <div class="actions">
        <span class="rerip"><span data-i18n="repag"></span> <input type="range" id="rescene" min="0.01" max="0.2" step="0.005" value="0.03">
          <span id="resceneVal" class="muted">0.030</span>
          <button id="repag" data-i18n="apply" data-tip="repagTip"></button></span>
        <a class="dl hidden" id="dlVideo" href="#" data-i18n="dlVideo"></a>
        <a class="dl" id="dlSrt" href="#" data-i18n="dlSrt"></a>
        <a class="dl" id="dlMd" href="#" data-i18n="dlMd"></a>
        <button id="back" data-i18n="back"></button>
      </div>
    </div>
    <div class="layout">
      <div class="vwrap">
        <video id="player" controls preload="metadata"></video>
        <div id="vmeta"></div>
      </div>
      <div id="pages"></div>
    </div>
  </section>
</main>
<div id="usersModal" class="modal hidden"><div class="mcard">
  <h3 style="margin-top:0" data-i18n="users"></h3>
  <table id="usersTable"><thead><tr>
    <th data-i18n="uName"></th><th data-i18n="uStatus"></th><th data-i18n="uRole"></th>
    <th data-i18n="uCreated"></th><th data-i18n="uLast"></th><th></th>
  </tr></thead><tbody id="usersBody"></tbody></table>
  <p class="err" id="usersErr"></p>
  <div class="arow"><button id="usersClose" data-i18n="close"></button></div>
</div></div>

const HTML_LANG = { en: "en", "zh-TW": "zh-Hant", "zh-CN": "zh-Hans", ja: "ja" };

function detectLang() {
  const list = navigator.languages || [navigator.language || "en"];
  for (const raw of list) {
    const k = String(raw).toLowerCase();
    if (k.startsWith("zh")) return /(^|-)(tw|hk|mo|hant)/.test(k) ? "zh-TW" : "zh-CN";
    if (k.startsWith("ja")) return "ja";
    if (k.startsWith("en")) return "en";
  }
  return "en";
}

let CUR = "en";
const t = (k) => (I18N[CUR] || I18N.en)[k] || I18N.en[k] || k;

function applyLang() {
  const saved = localStorage.getItem("ui_lang") || "auto";
  CUR = saved === "auto" ? detectLang() : saved;
  document.documentElement.lang = HTML_LANG[CUR] || "en";
  document.title = t("pageTitle");
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-html]").forEach((el) => {
    el.innerHTML = t(el.dataset.i18nHtml);
  });
  document.querySelectorAll("[data-tip]").forEach((el) => {
    el.title = t(el.dataset.tip);
  });
  $("uiLang").value = saved;
  if (ME) renderUserBox();
  if (!$("fileList").classList.contains("hidden")) renderFileList();
  else $("fileInfo").textContent = t("fileInfo");
  if (!$("result").classList.contains("hidden") && lastJob) showResult(lastJob);
  else if (!$("progressCard").classList.contains("hidden") && lastJob) renderProg(lastJob);
}

$("uiLang").addEventListener("change", () => {
  const v = $("uiLang").value;
  if (v === "auto") localStorage.removeItem("ui_lang");
  else localStorage.setItem("ui_lang", v);
  applyLang();
});

const fmt = (s) => {
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h ? `${p(h)}:${p(m)}:${p(sec)}` : `${p(m)}:${p(sec)}`;
};
$("drop").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", () => {
  setFiles(Array.from($("file").files));
  $("file").value = "";
});
for (const ev of ["dragover", "dragleave", "drop"]) {
  $("drop").addEventListener(ev, (e) => {
    if (!e.dataTransfer.types.includes("Files")) return;
    e.preventDefault();
    $("drop").classList.toggle("over", ev === "dragover");
    if (ev === "drop") setFiles(Array.from(e.dataTransfer.files));
  });
}
function setFiles(list) {
  pickedFiles = (list || []).filter((f) =>
    f && (f.type.startsWith("video/") || /\.(mp4|mkv|webm|mov|avi|flv|m4v|ts|mpg|mpeg|wmv)$/i.test(f.name)));
  renderFileList();
}
let dragIdx = null;
function moveFile(from, to) {
  if (to < 0 || to >= pickedFiles.length) return;
  const [x] = pickedFiles.splice(from, 1);
  pickedFiles.splice(to, 0, x);
  renderFileList();
}
function renderFileList() {
  const host = $("fileList");
  host.innerHTML = "";
  const n = pickedFiles.length;
  host.classList.toggle("hidden", n === 0);
  $("orderHint").classList.toggle("hidden", n < 2);
  pickedFiles.forEach((f, i) => {
    const row = document.createElement("div");
    row.className = "fitem";
    const grip = document.createElement("span");
    grip.className = "grip hidden";
    grip.textContent = "⋮⋮";
    grip.title = t("dragToSort");
    const num = document.createElement("span");
    num.className = "fnum";
    num.textContent = "#" + (i + 1);
    const name = document.createElement("span");
    name.className = "fname";
    name.textContent = f.name;
    const sz = document.createElement("span");
    sz.className = "fsz";
    sz.textContent = (f.size / 1048576).toFixed(1) + " MB";
    const mv = (up, label, dis) => {
      const b = document.createElement("button");
      b.className = "mv";
      b.textContent = label;
      b.title = up ? t("moveUp") : t("moveDown");
      b.disabled = dis;
      b.addEventListener("click", () => moveFile(i, up ? i - 1 : i + 1));
      return b;
    };
    const upBtn = mv(true, "▲", i === 0);
    const downBtn = mv(false, "▼", i === n - 1);
    const rm = document.createElement("button");
    rm.className = "rm";
    rm.title = t("removeFile");
    rm.textContent = "×";
    rm.addEventListener("click", () => {
      pickedFiles.splice(i, 1);
      renderFileList();
    });
    if (n > 1) {
      grip.classList.remove("hidden");
      row.draggable = true;
      row.addEventListener("dragstart", () => {
        dragIdx = i;
        row.classList.add("dragging");
      });
      row.addEventListener("dragover", (e) => {
        if (dragIdx !== null && dragIdx !== i) {
          e.preventDefault();
          row.classList.add("dragover");
        }
      });
      row.addEventListener("dragleave", () => row.classList.remove("dragover"));
      row.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        row.classList.remove("dragover");
        if (dragIdx !== null && dragIdx !== i) moveFile(dragIdx, i);
        dragIdx = null;
      });
      row.addEventListener("dragend", () => {
        row.classList.remove("dragging");
        dragIdx = null;
      });
    }
    row.append(grip, num, name, sz, upBtn, downBtn, rm);
    host.appendChild(row);
  });
  if (n === 1) {
    $("fileInfo").textContent =
      `${pickedFiles[0].name} (${(pickedFiles[0].size / 1048576).toFixed(1)} MB)`;
  } else if (n > 1) {
    const total = pickedFiles.reduce((s, f) => s + f.size, 0);
    $("fileInfo").textContent = t("mergeNote")
      .replace("{n}", n)
      .replace("{mb}", (total / 1048576).toFixed(1) + " MB");
  } else {
    $("fileInfo").textContent = t("fileInfo");
  }
  $("submit").disabled = n === 0;
}
$("scene").addEventListener("input", () =>
  $("sceneVal").textContent = Number($("scene").value).toFixed(3));
$("rescene").addEventListener("input", () =>
  $("resceneVal").textContent = Number($("rescene").value).toFixed(3));
$("repag").addEventListener("click", async () => {
  if (!curId) return;
  $("repag").disabled = true;
  const fd = new FormData();
  fd.append("reuse_from", curId);
  fd.append("scene_threshold", $("rescene").value);
  fd.append("correct", (lastJob && lastJob.params && lastJob.params.correct === false) ? "0" : "1");
  try {
    const r = await api("/api/jobs", { method: "POST", body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    poll((await r.json()).id);
  } catch (e) {
    alert(t("repagFail") + e.message);
  } finally {
    $("repag").disabled = false;
  }
});

$("submit").addEventListener("click", async () => {
  if (!pickedFiles.length) return;
  $("submit").disabled = true;
  $("upErr").textContent = "";
  const fd = new FormData();
  for (const f of pickedFiles) fd.append("files", f);
  fd.append("model", $("model").value);
  fd.append("language", $("lang").value);
  fd.append("scene_threshold", $("scene").value);
  fd.append("correct", $("correct").checked ? "1" : "0");
  $("uploadCard").classList.add("hidden");
  $("progressCard").classList.remove("hidden");
  const setUp = (stepKey, frac) => {
    $("progStep").textContent = t(stepKey);
    $("progFill").style.width = Math.round(frac * 100) + "%";
    $("progPct").textContent = Math.round(frac * 100) + "%";
    $("progNote").textContent = "";
  };
  setUp("uploading", 0);
  try {
    const id = await uploadJob(fd, (frac) => setUp(frac >= 1 ? "uploadDone" : "uploading", frac));
    poll(id);
  } catch (e) {
    $("progressCard").classList.add("hidden");
    $("uploadCard").classList.remove("hidden");
    $("upErr").textContent = t("uploadFail") + e.message;
    $("submit").disabled = false;
  }
});

function uploadJob(fd, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/jobs");
    xhr.upload.addEventListener("progress", (ev) => {
      if (ev.lengthComputable) onProgress(ev.loaded / Math.max(ev.total, 1));
    });
    xhr.addEventListener("load", () => {
      if (xhr.status === 401) { showAuth(); reject(new Error(t("sessionExpired"))); return; }
      if (xhr.status < 200 || xhr.status >= 300) {
        let msg = xhr.statusText || String(xhr.status);
        try { msg = JSON.parse(xhr.responseText).detail || msg; } catch (e) { /* ignore */ }
        reject(new Error(msg));
        return;
      }
      try { resolve(JSON.parse(xhr.responseText).id); }
      catch (e) { reject(new Error(t("unknownErr"))); }
    });
    xhr.addEventListener("error", () => reject(new Error(t("netErr"))));
    xhr.addEventListener("abort", () => reject(new Error(t("netErr"))));
    xhr.send(fd);
  });
}

const statusLabel = (s) =>
  I18N[CUR]["st_" + s] || I18N.en["st_" + s] || s;

function renderProg(j) {
  if (j.status === "error") {
    $("progStep").innerHTML = '<span class="err">' + esc(t("procFail")) +
      esc(j.error || t("unknownErr")) + "</span>";
    $("progFill").style.background = "var(--bad)";
  } else {
    const key = STEPS[j.step];
    $("progStep").textContent = key ? t(key) : (j.step || t("processing"));
    $("progFill").style.background = "linear-gradient(90deg,#2563eb,#5b8def)";
  }
  $("progFill").style.width = Math.round((j.progress || 0) * 100) + "%";
  $("progPct").textContent = Math.round((j.progress || 0) * 100) + "%";
}

function poll(id) {
  clearTimeout(pollTimer);
  lastJob = null;
  $("uploadCard").classList.add("hidden");
  $("progressCard").classList.remove("hidden");
  const tick = async () => {
    let j;
    try {
      const r = await api("/api/jobs/" + id);
      j = await r.json();
    } catch (e) {
      if (ME === null) return;
      pollTimer = setTimeout(tick, 1500);
      return;
    }
    lastJob = j;
    renderProg(j);
    if (j.status === "done") { showResult(j); loadHistory(); }
    else if (j.status !== "error") pollTimer = setTimeout(tick, 900);
  };
  tick();
}

function showResult(j) {
  curId = j.id;
  lastJob = j;
  const st = (j.params && j.params.scene_threshold) || 0.03;
  $("rescene").value = Math.min(0.2, Math.max(0.01, st));
  $("resceneVal").textContent = Number($("rescene").value).toFixed(3);
  $("progressCard").classList.add("hidden");
  $("result").classList.remove("hidden");
  const res = j.result;
  $("vtitle").textContent = res.title || j.filename;
  $("player").src = `/api/jobs/${j.id}/video`;
  $("vmeta").textContent = t("vmeta")
    .replace("{f}", j.filename).replace("{d}", fmt(res.duration))
    .replace("{l}", res.language).replace("{n}", res.pages.length);
  $("dlSrt").href = `/api/jobs/${j.id}/export.srt`;
  $("dlMd").href = `/api/jobs/${j.id}/export.md`;
  const dlV = $("dlVideo");
  dlV.href = `/api/jobs/${j.id}/video?download=1`;
  dlV.classList.toggle("hidden", !res.merged);
  const host = $("pages");
  host.innerHTML = "";
  for (const p of res.pages) {
    const card = document.createElement("div");
    card.className = "page";
    const media = p.thumb
      ? `<img loading="lazy" src="/api/jobs/${j.id}/thumb/${p.index}" alt="${esc(t("pageN").replace("%d", p.index))}">`
      : `<div class="noimg">${esc(t("noThumb"))}</div>`;
    const segs = p.segments.map((s) =>
      `<p><a class="ts" data-t="${s.start}">${fmt(s.start)}</a>${esc(s.text)}</p>`).join("");
    card.innerHTML = `${media}<div class="pbody">
      <div class="phead"><span class="pnum">${esc(t("pageN").replace("%d", p.index))}</span>
      <span class="ptime">${fmt(p.start)} - ${fmt(p.end)}</span><h3>${esc(p.title)}</h3></div>
      <div class="segs">${segs || `<p class="muted">${esc(t("noSpeech"))}</p>`}</div></div>`;
    host.appendChild(card);
  }
  host.querySelectorAll("a.ts").forEach((a) =>
    a.addEventListener("click", () => {
      const v = $("player");
      v.currentTime = Number(a.dataset.t);
      v.play();
      v.scrollIntoView({ behavior: "smooth", block: "center" });
    }));
}

const esc = (t2) => String(t2).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function resetView() {
  clearTimeout(pollTimer);
  lastJob = null;
  curId = null;
  $("player").pause(); $("player").src = "";
  $("result").classList.add("hidden");
  $("progressCard").classList.add("hidden");
  $("uploadCard").classList.remove("hidden");
  $("submit").disabled = pickedFiles.length === 0;
}

$("back").addEventListener("click", () => {
  resetView();
  loadHistory();
});

const metaBusy = new Set();

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return iso.slice(0, 10);
  return d.toLocaleDateString(HTML_LANG[CUR] || CUR) + " " +
    d.toLocaleTimeString(HTML_LANG[CUR] || CUR, { hour: "2-digit", minute: "2-digit" });
}

async function loadHistory() {
  try {
    const items = await (await api("/api/jobs")).json();
    const box = $("history");
    box.innerHTML = "";
    for (const it of items) {
      const card = document.createElement("div");
      card.className = "hitem";
      const m = it.meta;
      const own = ME && ME.role === "admin" && it.owner ? " · " + esc(it.owner) : "";
      const foot = esc(it.filename) + " · " + esc(statusLabel(it.status)) + own +
        (it.pages ? " · " + it.pages + "p" : "");
      const htitle = (m && m.title_zh) || it.title || it.filename;
      const canDel = it.status === "done" || it.status === "error";
      let inner = `<div class="hdate">${esc(fmtDate(it.created_at))}</div>`;
      inner += `<div class="ht1">${esc(htitle)}</div>`;
      if (m && m.title_en) inner += `<div class="ht2">${esc(m.title_en)}</div>`;
      if (m && (m.summary_zh || m.summary_en)) {
        inner += `<div class="hsum"><span class="szh">${esc(m.summary_zh || "")}</span>` +
          `<span class="sen">${esc(m.summary_en || "")}</span></div>`;
      }
      inner += `<div class="hfoot"><span>${foot}</span><span class="hacts">` +
        ((m && (m.summary_zh || m.summary_en))
          ? `<button class="htog" data-i18n="expand"></button>` : "") +
        (canDel ? `<button class="hdel" data-i18n="delBtn"></button>` : "") +
        `</span></div>`;
      card.innerHTML = inner;
      card.addEventListener("click", () => pollOpen(it.id));
      const tog = card.querySelector(".htog");
      if (tog) {
        tog.textContent = t("expand");
        tog.addEventListener("click", (e) => {
          e.stopPropagation();
          const open = card.classList.toggle("open");
          tog.textContent = t(open ? "collapse" : "expand");
        });
      }
      const del = card.querySelector(".hdel");
      if (del) {
        del.textContent = t("delBtn");
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          if (!confirm(t("delConfirm").replace("{n}", htitle))) return;
          del.disabled = true;
          api("/api/jobs/" + it.id, { method: "DELETE" }).then((r) => {
            if (!r.ok) {
              return r.json().then((d) => {
                del.disabled = false;
                alert((d && d.detail) || t("delFail"));
              });
            }
            if (curId === it.id) resetView();
            loadHistory();
          }).catch(() => { del.disabled = false; });
        });
      }
      if (it.status === "done" && !m && !metaBusy.has(it.id)) {
        metaBusy.add(it.id);
        api("/api/jobs/" + it.id + "/meta", { method: "POST" })
          .then((r) => { if (r.ok) loadHistory(); })
          .catch(() => { /* ignore */ });
      }
      box.appendChild(card);
    }
  } catch (e) { /* ignore */ }
}

function pollOpen(id) {
  clearTimeout(pollTimer);
  api("/api/jobs/" + id).then((r) => r.json()).then((j) => {
    if (j.status === "done") showResult(j); else poll(id);
  }).catch(() => { /* auth expired */ });
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) {
    showAuth();
    throw new Error(t("sessionExpired"));
  }
  return r;
}

function showAuth() {
  ME = null;
  clearTimeout(pollTimer);
  $("userBox").classList.add("hidden");
  $("usersModal").classList.add("hidden");
  for (const id of ["uploadCard", "progressCard", "result"]) $(id).classList.add("hidden");
  $("historyPanel").classList.add("hidden");
  $("authErr").textContent = "";
  $("authMsg").textContent = "";
  $("authCard").classList.remove("hidden");
}

function renderUserBox() {
  if (!ME) return;
  $("uNameLbl").textContent = ME.name || ME.username;
  $("uRoleLbl").textContent = ME.role === "admin" ? t("role_admin") : t("role_user");
  $("btnUsers").classList.toggle("hidden", ME.role !== "admin");
  $("userBox").classList.remove("hidden");
  $("historyPanel").classList.remove("hidden");
  loadHistory();
}

async function doAuth(url) {
  const username = $("auUser").value.trim();
  const password = $("auPass").value;
  $("btnLogin").disabled = $("btnRegister").disabled = true;
  $("authErr").textContent = "";
  try {
    const r = await fetch(url, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.status);
    $("auPass").value = "";
    if (d.pending) {
      $("authMsg").textContent = t("registeredNote");
      return;
    }
    ME = d.user;
    $("authMsg").textContent = "";
    renderUserBox();
    $("authCard").classList.add("hidden");
    $("uploadCard").classList.remove("hidden");
    loadHistory();
  } catch (e) {
    $("authErr").textContent = t("authFail") + e.message;
  } finally {
    $("btnLogin").disabled = $("btnRegister").disabled = false;
  }
}

$("btnLogin").addEventListener("click", () => doAuth("/api/auth/login"));
$("btnRegister").addEventListener("click", () => doAuth("/api/auth/register"));
for (const el of [$("auUser"), $("auPass")]) {
  el.addEventListener("keydown", (e) => { if (e.key === "Enter") doAuth("/api/auth/login"); });
}
$("btnLogout").addEventListener("click", async () => {
  try { await fetch("/api/auth/logout", { method: "POST" }); } catch (e) { /* ignore */ }
  $("player").pause();
  $("player").src = "";
  pickedFiles = [];
  renderFileList();
  showAuth();
});

async function openUsers() {
  $("usersErr").textContent = "";
  try {
    const r = await api("/api/admin/users");
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const list = await r.json();
    const tb = $("usersBody");
    tb.innerHTML = "";
    for (const u of list) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${esc(u.username)}</td>` +
        `<td>${esc(t("u_" + (u.status || "active")))}</td>` +
        `<td>${esc(u.role === "admin" ? t("role_admin") : t("role_user"))}</td>` +
        `<td>${esc(u.created_at || "-")}</td><td>${esc(u.last_login || "-")}</td><td></td>`;
      const act = (path, body, label) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.addEventListener("click", async () => {
          try {
            const rr = await api(`/api/admin/users/${u.id}/${path}`, {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            if (!rr.ok) throw new Error((await rr.json()).detail || rr.status);
            openUsers();
          } catch (e2) {
            $("usersErr").textContent = e2.message;
          }
        });
        tr.lastElementChild.appendChild(b);
      };
      if (ME && u.id !== ME.id) {
        if (u.status !== "active") act("status", { status: "active" }, t("enable"));
        else act("status", { status: "disabled" }, t("disable"));
        if (u.status === "active") {
          act("role", { role: u.role === "admin" ? "user" : "admin" },
            u.role === "admin" ? t("demote") : t("promote"));
        }
      }
      tb.appendChild(tr);
    }
    $("usersModal").classList.remove("hidden");
  } catch (e) {
    $("usersErr").textContent = e.message;
    $("usersModal").classList.remove("hidden");
  }
}
$("btnUsers").addEventListener("click", openUsers);
$("usersClose").addEventListener("click", () => $("usersModal").classList.add("hidden"));

applyLang();
(async function boot() {
  try {
    const r = await fetch("/api/auth/me");
    if (r.ok) ME = await r.json();
  } catch (e) { /* ignore */ }
  if (ME) {
    renderUserBox();
    $("uploadCard").classList.remove("hidden");
    loadHistory();
  } else {
    showAuth();
  }
})();
</script>
</body>
</html>
